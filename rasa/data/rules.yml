version: "3.1"

rules:

  - rule: 인사 응답
    steps:
      - intent: greet
      - action: utter_greet

  - rule: 작별 인사 응답
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: 과정 안내 응답
    steps:
      - intent: ask_course_info
      - action: utter_course_info

  - rule: 지점 안내 응답
    steps:
      - intent: ask_branch_info
      - action: utter_branch_info

  - rule: 범위 외 질문 응답
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - rule: 예약 폼 활성화
    steps:
      - intent: make_reservation
      - action: reservation_form
      - active_loop: reservation_form

  - rule: 예약 폼 완료 후 처리
    condition:
      - active_loop: reservation_form
    steps:
      - action: reservation_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_complete_reservation

  - rule: 예약 확인 처리
    steps:
      - intent: check_reservation
      - action: action_check_reservation

  - rule: 예약 취소 처리
    steps:
      - intent: cancel_reservation
      - action: action_cancel_reservation

  - rule: 폴백 응답
    steps:
      - intent: nlu_fallback
      - action: utter_default
