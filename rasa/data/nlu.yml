version: "3.1"

nlu:
  - intent: greet
    examples: |
      - 안녕하세요
      - 안녕
      - 반갑습니다
      - 안녕하세요!
      - 안녕하세요 챗봇
      - 하이
      - 여보세요
      - 안녕하십니까
      - 좋은 아침이에요
      - 좋은 저녁이에요
      - 안녕하세요, 도움이 필요해요

  - intent: goodbye
    examples: |
      - 감사합니다
      - 감사해요
      - 안녕히 계세요
      - 다음에 또 올게요
      - 잘 있어요
      - bye
      - 바이
      - 종료할게요
      - 끝낼게요
      - 이만 할게요
      - 도움 주셔서 감사해요

  - intent: affirm
    examples: |
      - 네
      - 네 맞아요
      - 맞습니다
      - 그렇습니다
      - 예
      - 맞아요
      - 확인이요
      - 진행해 주세요
      - 좋아요
      - 오케이
      - OK
      - ok
      - 동의합니다
      - 맞습니다

  - intent: deny
    examples: |
      - 아니요
      - 아니오
      - 아니에요
      - 아니
      - 취소요
      - 다시 할게요
      - 수정할게요
      - 잘못됐어요
      - 틀렸어요
      - 바꿀게요
      - nope
      - no
      - 안 돼요

  - intent: make_reservation
    examples: |
      - 예약하고 싶어요
      - 수강 신청하려고요
      - 수강 예약 해주세요
      - 등록하고 싶어요
      - 수업 신청하고 싶습니다
      - [강남점](branch) [토익](course) 예약하고 싶어요
      - [홍대점](branch)에서 [영어회화](course) 신청하려고요
      - [잠실점](branch) [오픽](course) 수강 등록 부탁합니다
      - [분당점](branch) [일본어](course) 예약 가능한가요?
      - [인천점](branch) [자격증](course) 등록하고 싶습니다
      - [토익](course) 수업 예약하고 싶어요
      - [영어회화](course) 신청할게요
      - [강남점](branch) 수강 신청하겠습니다
      - 수강료 결제하고 싶어요
      - 다음 달부터 수강하고 싶어요
      - 오늘 예약 신청하면 되나요
      - 처음 등록하려고 하는데요
      - 상담 후 예약하고 싶어요

  - intent: check_reservation
    examples: |
      - 예약 확인하고 싶어요
      - 내 예약 조회해주세요
      - 예약 내역 확인
      - 예약 조회
      - 제 수강 예약 확인해주세요
      - 예약번호로 확인하고 싶어요
      - 예약 현황 알고 싶어요
      - 제가 예약한 거 확인 가능한가요
      - 등록 확인해주세요
      - 수강 신청 되어있나요

  - intent: cancel_reservation
    examples: |
      - 예약 취소하고 싶어요
      - 취소해주세요
      - 수강 취소하려고요
      - 예약 취소 부탁합니다
      - 등록 취소하고 싶어요
      - 신청 취소 가능한가요
      - 예약 취소해주시겠어요
      - 수강 신청 취소해 주세요
      - 예약 삭제해주세요

  - intent: ask_course_info
    examples: |
      - 과정 안내해 주세요
      - 어떤 과정이 있어요?
      - 수업 종류 알려주세요
      - 강좌 목록 보여주세요
      - 토익 과정 정보 알려주세요
      - [오픽](course) 수업 어떻게 되나요?
      - [영어회화](course) 과정 설명해주세요
      - 수강료가 얼마예요
      - 수업 시간표 알려주세요
      - 어떤 강좌를 들을 수 있어요
      - 프로그램 알려주세요
      - 커리큘럼 안내해주세요
      - 비용이 얼마예요
      - [일본어](course) 수업 있어요?
      - [자격증](course) 강의 정보 주세요

  - intent: ask_branch_info
    examples: |
      - 지점이 어디 있어요?
      - 지점 안내해주세요
      - 어디서 수업해요?
      - 강남점 위치가 어디예요?
      - [홍대점](branch) 어떻게 가나요?
      - [잠실점](branch) 위치 알려주세요
      - [분당점](branch) 주소가 어떻게 되나요?
      - [인천점](branch) 어디 있어요?
      - 가까운 지점 알려주세요
      - 지하철역에서 가까운 지점 있어요?
      - 지점 목록 보여주세요

  - intent: provide_branch
    examples: |
      - [강남점](branch)이요
      - [홍대점](branch)으로 해주세요
      - [잠실점](branch)
      - [분당점](branch) 원해요
      - [인천점](branch)으로 등록할게요
      - [강남점](branch) 가고 싶어요
      - [홍대점](branch) 다니고 싶어요
      - [잠실점](branch) 원해요
      - [분당점](branch)이 좋아요
      - [인천점](branch) 선택할게요

  - intent: provide_course
    examples: |
      - [토익](course)이요
      - [오픽](course)으로 해주세요
      - [영어회화](course) 원해요
      - [일본어](course) 배우고 싶어요
      - [자격증](course) 과정이요
      - [토익](course) 수업 신청할게요
      - [영어회화](course) 선택할게요
      - [오픽](course) 준비하고 싶어요
      - [일본어](course)요
      - [자격증](course)으로 할게요

  - intent: provide_date
    examples: |
      - [2026-07-01](date)
      - [2026-07-15](date)부터 시작하고 싶어요
      - [7월 1일](date)이요
      - [다음 달 1일](date)부터요
      - [2026-08-01](date)로 해주세요
      - [7월 10일](date) 가능한가요
      - [2026-07-20](date)
      - [이번 주 월요일](date)부터요
      - [2026-09-01](date)에 시작할게요

  - intent: provide_time
    examples: |
      - [19:30](time)이요
      - [오후 7시 반](time)으로 해주세요
      - [저녁 7시](time)
      - [오전 10시](time)
      - [10:00](time)
      - [오후 2시](time)에 원해요
      - [14:00](time)로 해주세요
      - [저녁 8시](time) 가능한가요
      - [20:00](time)
      - [주말 오전 9시](time)

  - intent: provide_name
    examples: |
      - [김민준](name)이에요
      - 이름은 [이서연](name)입니다
      - [박지훈](name)이요
      - 제 이름은 [최수아](name)예요
      - [정도현](name)입니다
      - [한지민](name)이라고 해요
      - [오준서](name)예요
      - 성함은 [임나연](name)입니다
      - [강민서](name)
      - [윤도경](name)으로 등록해주세요

  - intent: provide_phone
    examples: |
      - [010-1234-5678](phone)이요
      - 연락처는 [010-9876-5432](phone)입니다
      - [010-5555-1234](phone)로 연락주세요
      - 핸드폰 번호 [010-2222-3333](phone)이에요
      - [01012345678](phone)
      - [010-1111-2222](phone)
      - 전화번호 [010-7777-8888](phone)입니다
      - [010-4444-5555](phone)요

  - intent: out_of_scope
    examples: |
      - 오늘 날씨 어때요?
      - 주식 추천해줘
      - 맛집 알려줘
      - 영화 추천
      - 게임 추천해줘
      - 강아지 키우는 방법
      - 오늘 뉴스는?
      - 코로나 정보 알려줘

  - synonym: 강남점
    examples: |
      - 강남
      - 강남 캠퍼스
      - 강남 지점

  - synonym: 홍대점
    examples: |
      - 홍대
      - 홍대 캠퍼스
      - 홍대 지점

  - synonym: 잠실점
    examples: |
      - 잠실
      - 잠실 캠퍼스
      - 잠실 지점

  - synonym: 분당점
    examples: |
      - 분당
      - 분당 캠퍼스
      - 분당 지점

  - synonym: 인천점
    examples: |
      - 인천
      - 인천 캠퍼스
      - 인천 지점

  - synonym: 영어회화
    examples: |
      - 회화
      - 영어 회화
      - 영어 스피킹
      - 스피킹

  - regex: phone
    examples: |
      - 010-\d{4}-\d{4}
      - 010\d{8}

  - regex: date
    examples: |
      - \d{4}-\d{2}-\d{2}
