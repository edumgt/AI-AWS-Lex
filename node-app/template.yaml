AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Chatbot API — Lambda + API Gateway HTTP API + Cognito JWT authorizer
  GET /api/health · GET /api/engines · GET /api/suggestions · POST /api/chat

Parameters:
  LexBotId:
    Type: String
    Default: VP2C22LIIZ
  LexBotAliasId:
    Type: String
    Default: WLCO3AVN1Z
  LexLocaleId:
    Type: String
    Default: ko_KR
  DefaultAiEngine:
    Type: String
    Default: aws-lex
    AllowedValues: [aws-lex, azure-clu, ollama, rasa, openai-compatible]
  EnabledAiEngines:
    Type: String
    Default: aws-lex
  EnableLocalReservationFlow:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:9000,https://www.edumgt.co.kr"
  CognitoCallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:9000/,https://www.edumgt.co.kr/lex/"
  CognitoLogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:9000/,https://www.edumgt.co.kr/lex/"
  CognitoDomainPrefix:
    Type: String
    Default: ""

Conditions:
  HasCustomCognitoDomainPrefix: !Not [!Equals [!Ref CognitoDomainPrefix, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 29
    Architectures: [arm64]
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"

Resources:
  ChatUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false

  ChatUserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: chatbot-api
      Name: chatbot-api
      UserPoolId: !Ref ChatUserPool
      Scopes:
        - ScopeName: chat
          ScopeDescription: Invoke chatbot API routes

  ChatUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-spa"
      UserPoolId: !Ref ChatUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - chatbot-api/chat
      CallbackURLs: !Ref CognitoCallbackUrls
      LogoutURLs: !Ref CognitoLogoutUrls
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  ChatUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref ChatUserPool
      Domain: !If
        - HasCustomCognitoDomainPrefix
        - !Ref CognitoDomainPrefix
        - !Sub "${AWS::StackName}-${AWS::AccountId}"

  ChatHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders:
          - content-type
          - authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowCredentials: false
        MaxAge: 300
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${ChatUserPool}"
              audience:
                - !Ref ChatUserPoolClient
            AuthorizationScopes:
              - chatbot-api/chat

  ChatApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LexAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lex:RecognizeText
                  - lex:GetSession
                  - lex:PutSession
                  - lex:DeleteSession
                Resource: !Sub "arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/*/*"
              - Effect: Allow
                Action:
                  - lex:ListSlotTypes
                  - lex:DescribeSlotType
                Resource: !Sub "arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot/${LexBotId}/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

  ChatApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: "chatbot API — /api/health /api/engines /api/suggestions /api/chat"
      Role: !GetAtt ChatApiFunctionRole.Arn
      CodeUri: lex-chat-ux/
      Handler: server/lambda.handler
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            Path: /api/health
            Method: GET
            ApiId: !Ref ChatHttpApi
            Auth:
              Authorizer: NONE
        EnginesRoute:
          Type: HttpApi
          Properties:
            Path: /api/engines
            Method: GET
            ApiId: !Ref ChatHttpApi
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - chatbot-api/chat
        SuggestionsRoute:
          Type: HttpApi
          Properties:
            Path: /api/suggestions
            Method: GET
            ApiId: !Ref ChatHttpApi
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - chatbot-api/chat
        ChatRoute:
          Type: HttpApi
          Properties:
            Path: /api/chat
            Method: POST
            ApiId: !Ref ChatHttpApi
            Auth:
              Authorizer: CognitoJwtAuthorizer
              AuthorizationScopes:
                - chatbot-api/chat
      Environment:
        Variables:
          LEX_BOT_ID: !Ref LexBotId
          LEX_BOT_ALIAS_ID: !Ref LexBotAliasId
          LEX_LOCALE_ID: !Ref LexLocaleId
          DEFAULT_AI_ENGINE: !Ref DefaultAiEngine
          ENABLED_AI_ENGINES: !Ref EnabledAiEngines
          ENABLE_LOCAL_RESERVATION_FLOW: !Ref EnableLocalReservationFlow
          BRANCH_VALUES: "강남WM센터,여의도지점,압구정PB센터,종로지점,판교지점"
          PRODUCT_VALUES: "국내주식,해외주식,ETF,ELS,채권,펀드,ISA,연금저축"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - server/lambda.js
        External:
          - "@aws-sdk/client-lex-runtime-v2"
          - "@aws-sdk/client-lex-models-v2"

  ChatApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChatApiFunction}"
      RetentionInDays: 14

Outputs:
  ApiGatewayUrl:
    Description: "Protected API Gateway base URL"
    Value: !Sub "https://${ChatHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  ChatApiFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt ChatApiFunction.Arn

  HealthCheckUrl:
    Description: Public health endpoint
    Value: !Sub "https://${ChatHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/health"

  CognitoUserPoolId:
    Description: Cognito user pool ID
    Value: !Ref ChatUserPool

  CognitoUserPoolClientId:
    Description: Cognito app client ID for the SPA
    Value: !Ref ChatUserPoolClient

  CognitoHostedUiBaseUrl:
    Description: Cognito Hosted UI base URL
    Value: !Sub "https://${ChatUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  CognitoIssuer:
    Description: JWT issuer for API Gateway authorizer
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${ChatUserPool}"

  CognitoApiScope:
    Description: OAuth scope required by the API
    Value: "chatbot-api/chat"

  CognitoLoginUrl:
    Description: Sample Hosted UI login URL
    Value: !Sub
      - "https://${Domain}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${ClientId}&response_type=code&scope=openid+email+profile+chatbot-api%2Fchat&redirect_uri=${RedirectUri}"
      - Domain: !Ref ChatUserPoolDomain
        ClientId: !Ref ChatUserPoolClient
        RedirectUri: !Select [0, !Ref CognitoCallbackUrls]
