version: "3.9"

# =============================================================
# 챗봇 웹앱 스택
#
# 서비스:
#   1. ollama-adapter : Node.js REST 어댑터 (:3200) → Windows Ollama (host:11434)
#   2. webapp         : Quasar 프론트엔드 (:9000) + Express API (:3000)
#                       /api/* → local Express 인증계층 → 통합 핸들러 → Lex/Rasa/Ollama
#
# 시작:
#   docker compose up --build
#
# 브라우저:
#   http://localhost:9000
# =============================================================

services:

  # -----------------------------------------------------------
  # 1. Ollama Node.js 어댑터 (프론트 ↔ Ollama 포맷 변환)
  #    Ollama는 Windows 호스트에서 실행 중 (host.docker.internal:11434)
  # -----------------------------------------------------------
  ollama-adapter:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./ollama/server:/app
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=exaone3.5
      - PORT=3200
    ports:
      - "3200:3200"
    restart: unless-stopped
    networks:
      - chatbot-net
    command: sh -c "npm install && node index.js"

  # -----------------------------------------------------------
  # 2. 웹앱 (Quasar 프론트엔드 :9000 + Express API :3000)
  #    /api/* → 로컬 Express 인증계층 → 통합 엔진 핸들러
  # -----------------------------------------------------------
  webapp:
    build:
      context: ./lex-chat-ux
      dockerfile: Dockerfile
    ports:
      - "9000:9000"    # Quasar dev server (브라우저 접속)
      - "3000:3000"    # Express API server
    volumes:
      - /root/.aws:/root/.aws:ro
    env_file:
      - .env
    environment:
      - PORT=3000
    restart: unless-stopped
    networks:
      - chatbot-net

# =============================================================
# 네트워크
# =============================================================
networks:
  chatbot-net:
    driver: bridge
