version: "3.1"

nlu:
  - intent: greet
    examples: |
      - 안녕하세요
      - 안녕
      - 반갑습니다
      - 안녕하세요!
      - 하이
      - 여보세요
      - 안녕하십니까
      - 좋은 아침이에요
      - 안녕하세요, 도움이 필요해요

  - intent: goodbye
    examples: |
      - 감사합니다
      - 감사해요
      - 안녕히 계세요
      - 다음에 또 올게요
      - 잘 있어요
      - bye
      - 종료할게요
      - 끝낼게요
      - 이만 할게요
      - 도움 주셔서 감사해요

  - intent: affirm
    examples: |
      - 네
      - 네 맞아요
      - 맞습니다
      - 그렇습니다
      - 예
      - 맞아요
      - 확인이요
      - 진행해 주세요
      - 좋아요
      - 오케이
      - OK
      - 동의합니다

  - intent: deny
    examples: |
      - 아니요
      - 아니오
      - 아니에요
      - 아니
      - 취소요
      - 다시 할게요
      - 수정할게요
      - 잘못됐어요
      - 틀렸어요
      - 바꿀게요
      - nope
      - 안 돼요

  - intent: help
    examples: |
      - 무슨 기능이 있어?
      - 뭘 도와줄 수 있어?
      - 어떤 걸 할 수 있어?
      - 상담 예약은 어떻게 해?
      - 어떻게 사용해?
      - 도움말
      - 사용법 알려줘
      - 뭘 물어볼 수 있어?
      - 도움이 필요해요
      - 기능 설명해줘
      - 뭐 할 수 있어?
      - 어떤 서비스가 있어?

  - intent: book_consultation
    examples: |
      - 투자상담 예약하고 싶어요
      - 상담 예약해 주세요
      - 투자 상담 받고 싶어요
      - 상담 신청하고 싶어요
      - 예약하고 싶어요
      - 상담 예약할게요
      - [여의도지점](branch) [ETF](product) 상담 예약하고 싶어요
      - [강남WM센터](branch) [국내주식](product) 상담 예약, 이름 [김도영](name)
      - [판교지점](branch) [연금저축](product) [7월 13일](date) [10:00](time) 예약해줘
      - [압구정PB센터](branch) [ELS](product) 상담 신청
      - [종로지점](branch) [해외주식](product) 예약해줘
      - [ETF](product) 상담 받고 싶어요
      - [ISA](product) 관련 상담 예약
      - [강남WM센터](branch)에서 상담 받고 싶어요
      - [채권](product) 투자 상담 예약해주세요
      - [펀드](product) 상담 신청할게요
      - 내일 [여의도지점](branch) 상담 예약 가능한가요?
      - 처음으로 투자 상담 받으려고요
      - 상담 후 투자하고 싶어요

  - intent: check_consultation
    examples: |
      - 상담 예약 조회해줘
      - 내 예약 확인해주세요
      - 예약 내역 보여줘
      - 예약 조회
      - 예약 확인하고 싶어요
      - 예약번호 [C-TEST01](reservation_id) 확인
      - [C-HELLO1](reservation_id) 예약 조회해줘
      - 내가 예약한 거 확인해줘
      - 상담 예약 현황 알려줘
      - 방금 예약한 거 확인해줘
      - 최근 예약 조회
      - 마지막으로 예약한 거 보여줘
      - 예약 됐어?
      - 예약 확인 부탁해요

  - intent: cancel_consultation
    examples: |
      - 상담 예약 취소하고 싶어요
      - 예약 취소해주세요
      - 상담 취소할게요
      - 예약 취소 부탁합니다
      - 취소하고 싶어요
      - 예약번호 [C-HELLO1](reservation_id) 취소 요청
      - [C-TEST01](reservation_id) 취소해줘
      - 마지막 상담 예약 취소해줘
      - 방금 예약한 거 취소해줘
      - 최근 예약 취소
      - 예약 삭제해주세요
      - 상담 신청 취소 가능한가요?

  - intent: product_info
    examples: |
      - ISA 계좌 혜택이 뭐야
      - [ISA](product) 계좌 설명해줘
      - 해외주식 수수료 얼마야
      - [해외주식](product) 투자 방법 알려줘
      - ELS 위험도 어때?
      - [ELS](product) 상품이 뭐야?
      - [ETF](product) 투자 어떻게 해?
      - [국내주식](product) 매매 방법 알려줘
      - [채권](product) 투자 안전한가요?
      - [펀드](product) 종류 알려줘
      - [연금저축](product) 혜택이 뭐야?
      - 어떤 투자 상품이 있어?
      - 투자 상품 안내해줘
      - 상품 정보 알려줘
      - 주식 투자 어떻게 시작해?
      - ETF랑 펀드 차이가 뭐야?
      - ISA랑 연금저축 비교해줘

  - intent: provide_branch
    examples: |
      - [강남WM센터](branch)이요
      - [여의도지점](branch)으로 해주세요
      - [압구정PB센터](branch)
      - [종로지점](branch) 원해요
      - [판교지점](branch)으로 예약할게요
      - [강남WM센터](branch) 가고 싶어요
      - [여의도지점](branch) 다니고 싶어요
      - [압구정PB센터](branch) 원해요
      - [종로지점](branch)이 좋아요
      - [판교지점](branch) 선택할게요
      - 여의도요
      - 강남이요
      - 판교 지점이요

  - intent: provide_product
    examples: |
      - [국내주식](product)이요
      - [해외주식](product)으로 해주세요
      - [ETF](product) 원해요
      - [ELS](product) 상담받고 싶어요
      - [채권](product) 투자요
      - [펀드](product)로 할게요
      - [ISA](product) 계좌요
      - [연금저축](product) 선택할게요
      - ETF요
      - ISA 계좌로요
      - 국내주식이요
      - 해외주식 상담이요

  - intent: provide_date
    examples: |
      - [2026-07-01](date)
      - [2026-07-15](date)에 예약하고 싶어요
      - [7월 13일](date)이요
      - [다음 주 월요일](date)에요
      - [2026-08-01](date)로 해주세요
      - [7월 10일](date) 가능한가요
      - [2026-07-20](date)
      - [이번 주 금요일](date)이요
      - [2026-09-01](date)에 할게요
      - [8월 8일](date)

  - intent: provide_time
    examples: |
      - [10:00](time)이요
      - [오후 2시](time)로 해주세요
      - [14:00](time)
      - [오전 10시](time)
      - [11:00](time)
      - [16:00](time)에 원해요
      - [오후 4시](time)
      - [오전 11시](time) 가능한가요
      - [15:00](time)
      - [오후 3시](time)

  - intent: provide_name
    examples: |
      - [김도영](name)이에요
      - 이름은 [이서연](name)입니다
      - [박지훈](name)이요
      - 제 이름은 [최수아](name)예요
      - [정도현](name)입니다
      - [홍길동](name)이라고 해요
      - [이서준](name)이에요
      - 성함은 [임나연](name)입니다
      - [강민서](name)
      - [윤도경](name)으로 예약해주세요

  - intent: provide_phone
    examples: |
      - [010-1234-5678](phone)이요
      - 연락처는 [010-9876-5432](phone)입니다
      - [010-5555-1234](phone)로 연락주세요
      - 핸드폰 번호 [010-2222-3333](phone)이에요
      - [01012345678](phone)
      - [010-1111-2222](phone)
      - 전화번호 [010-7777-8888](phone)입니다
      - [010-4444-5555](phone)요
      - [010-9999-0000](phone)

  - intent: out_of_scope
    examples: |
      - 오늘 날씨 어때요?
      - 맛집 알려줘
      - 영화 추천
      - 게임 추천해줘
      - 강아지 키우는 방법
      - 오늘 뉴스는?
      - 코로나 정보 알려줘
      - 로또 번호 알려줘
      - 연예인 정보 알려줘

  - synonym: 강남WM센터
    examples: |
      - 강남
      - 강남WM
      - 강남 WM센터
      - 강남 지점

  - synonym: 여의도지점
    examples: |
      - 여의도
      - 여의도 지점

  - synonym: 압구정PB센터
    examples: |
      - 압구정
      - 압구정PB
      - 압구정 PB센터
      - 압구정 지점

  - synonym: 종로지점
    examples: |
      - 종로
      - 종로 지점

  - synonym: 판교지점
    examples: |
      - 판교
      - 판교 지점

  - regex: phone
    examples: |
      - 010-\d{4}-\d{4}
      - 010\d{8}

  - regex: date
    examples: |
      - \d{4}-\d{2}-\d{2}

  - regex: reservation_id
    examples: |
      - C-[A-Z0-9]{5,6}
