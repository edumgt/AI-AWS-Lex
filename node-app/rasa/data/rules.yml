version: "3.1"

rules:

  - rule: 인사 응답
    steps:
      - intent: greet
      - action: utter_greet

  - rule: 작별 인사 응답
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: 도움말 응답
    steps:
      - intent: help
      - action: utter_help

  - rule: 투자 상품 안내
    steps:
      - intent: product_info
      - action: utter_product_info

  - rule: 범위 외 질문 응답
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - rule: 상담예약 폼 활성화
    steps:
      - intent: book_consultation
      - action: consultation_form
      - active_loop: consultation_form

  - rule: 상담예약 폼 완료 후 처리
    condition:
      - active_loop: consultation_form
    steps:
      - action: consultation_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_complete_consultation

  - rule: 예약 조회 처리
    steps:
      - intent: check_consultation
      - action: action_check_consultation

  - rule: 예약 취소 처리
    steps:
      - intent: cancel_consultation
      - action: action_cancel_consultation

  - rule: 폴백 응답
    steps:
      - intent: nlu_fallback
      - action: utter_default
