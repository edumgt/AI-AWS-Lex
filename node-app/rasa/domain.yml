version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - help
  - book_consultation
  - check_consultation
  - cancel_consultation
  - product_info
  - provide_branch
  - provide_product
  - provide_date
  - provide_time
  - provide_name
  - provide_phone
  - out_of_scope

entities:
  - branch
  - product
  - date
  - time
  - name
  - phone
  - reservation_id

slots:
  branch:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: branch
  product:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: product
  date:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: date
  time:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: time
  name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: name
  phone:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: phone

forms:
  consultation_form:
    required_slots:
      - branch
      - product
      - date
      - time
      - name
      - phone

responses:
  utter_greet:
    - text: "안녕하세요! 금융투자 상담 예약 챗봇입니다. 무엇을 도와드릴까요?\n예) \"여의도지점 ETF 상담 예약하고 싶어요\""

  utter_goodbye:
    - text: "감사합니다! 성공적인 투자 되세요. 궁금하신 점이 있으면 언제든지 찾아주세요."

  utter_help:
    - text: "다음과 같은 서비스를 제공합니다:\n\n• 투자상담 예약 — 지점, 상품, 날짜, 시간, 이름, 연락처를 알려주시면 예약해드립니다\n• 예약 조회 — 예약번호로 상담 내역을 확인합니다\n• 예약 취소 — 예약번호로 상담을 취소합니다\n• 투자 상품 안내 — 국내주식, 해외주식, ETF, ELS, 채권, 펀드, ISA, 연금저축 정보를 안내합니다\n\n\"투자상담 예약하고 싶어요\"라고 말씀해 보세요!"

  utter_ask_branch:
    - text: "어느 지점을 원하시나요?\n• 강남WM센터  • 여의도지점  • 압구정PB센터  • 종로지점  • 판교지점"

  utter_ask_product:
    - text: "어떤 투자 상품으로 상담받으시겠어요?\n• 국내주식  • 해외주식  • ETF  • ELS  • 채권  • 펀드  • ISA  • 연금저축"

  utter_ask_date:
    - text: "상담 희망 날짜를 알려주세요. (예: 2026-07-15)"

  utter_ask_time:
    - text: "상담 희망 시간을 알려주세요. (예: 14:00)"

  utter_ask_name:
    - text: "예약자 성함을 알려주세요."

  utter_ask_phone:
    - text: "연락처를 알려주세요. (예: 010-1234-5678)"

  utter_product_info:
    - text: "투자 상품 안내입니다:\n\n• 국내주식 — 코스피/코스닥 상장 주식 직접 투자. 수수료 0.015%\n• 해외주식 — 미국/중국/일본 등 해외 주식 투자. 수수료 0.25%\n• ETF — 주가지수 추종 펀드. 분산투자·낮은 비용의 장점\n• ELS — 기초자산 연계 수익 구조. 조건부 원금보장 상품\n• 채권 — 국공채·회사채 투자. 안정적 이자수익\n• 펀드 — 전문 매니저가 운용하는 간접투자 상품\n• ISA — 다양한 금융상품을 한 계좌에서 절세 혜택으로 운용\n• 연금저축 — 노후 대비 장기 저축·투자. 세액공제 혜택\n\n자세한 상담은 예약을 진행해 주세요!"

  utter_out_of_scope:
    - text: "저는 금융투자 상담 예약 전용 챗봇입니다. 투자상담 예약, 예약 조회/취소, 투자 상품 안내 관련 질문을 해주세요."

  utter_default:
    - text: "죄송합니다, 무슨 말씀인지 잘 이해하지 못했어요.\n투자상담 예약, 예약 조회, 예약 취소, 투자 상품 안내 중 어떤 도움이 필요하신가요?"

actions:
  - action_complete_consultation
  - action_check_consultation
  - action_cancel_consultation
  - validate_consultation_form

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false
